name: Large Runner Docker Image Build & Publish
on:
  workflow_run:
    workflows: ["Docker"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-base-image:
    name: Resolve base image digest
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      brew_image: ${{ steps.resolve.outputs.brew_image }}
      brew_image_digest: ${{ steps.resolve.outputs.brew_image_digest }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve Homebrew/brew image digest
        id: resolve
        run: |
          brew_image_reference="$(docker buildx imagetools inspect ghcr.io/homebrew/brew:main --format '{{.Manifest.Digest}}')"
          IFS=: read -r brew_image_algorithm brew_image_digest <<< "${brew_image_reference}"
          if [ "${brew_image_algorithm}" != "sha256" ] || [ -z "${brew_image_digest}" ]; then
            echo "Unexpected digest format: ${brew_image_reference}" >&2
            exit 1
          fi
          echo "brew_image=ghcr.io/homebrew/brew@sha256:${brew_image_digest}" >> "$GITHUB_OUTPUT"
          echo "brew_image_digest=${brew_image_digest}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Docker image (${{ matrix.platform }})
    needs: resolve-base-image
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            platform_tag: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_tag: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - env:
          IMAGE_VALUE: ghcr.io/${{ github.repository_owner }}/runner
        run: echo "IMAGE=${IMAGE_VALUE,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }} Docker image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: runner
          platforms: ${{ matrix.platform }}
          build-args: HOMEBREW_BREW_IMAGE=${{ needs.resolve-base-image.outputs.brew_image }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Docker image
    needs: [resolve-base-image, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - env:
          IMAGE_VALUE: ghcr.io/${{ github.repository_owner }}/runner
        run: echo "IMAGE=${IMAGE_VALUE,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image changed
        if: github.event_name == 'schedule'
        id: check
        run: |
          new_digests="$(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ' | xargs)"
          if [ -z "${new_digests}" ]; then
            echo "No digests found; skipping push" >&2
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_digests="$(
            docker buildx imagetools inspect "${{ env.IMAGE }}:latest" \
              --format '{{range .Manifest.Manifests}}{{.Digest}}{{"\n"}}{{end}}' 2>/dev/null \
            | sed 's/sha256://' | sort | tr '\n' ' ' | xargs || true
          )"
          if [ "${new_digests}" = "${current_digests}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push manifest
        run: |
          mapfile -t digest_args < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sed "s#^#${IMAGE}@sha256:#")
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:latest" \
            "${digest_args[@]}"

      - name: Verify deployment secrets
        shell: bash
        env:
          AWS_PROJECT_ID: ${{ secrets.AWS_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$AWS_PROJECT_ID" ] && missing+=("AWS_PROJECT_ID")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required deployment secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure AWS Credentials
        id: aws_registry_credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_PROJECT_ID }}:role/GithubActionsRoleECRPush
          aws-region: us-east-1

      - name: AWS Elastic Container Registry Login
        id: aws_registry_login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Generate AWS image name
        env:
          AWS_REGISTRY: ${{ steps.aws_registry_login.outputs.registry }}
          BREW_IMAGE_DIGEST: ${{ needs.resolve-base-image.outputs.brew_image_digest }}
        run: |
          echo "AWS_IMAGE=${AWS_REGISTRY}/runner-ecr:${BREW_IMAGE_DIGEST}-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "AWS_IMAGE_LATEST=${AWS_REGISTRY}/runner-ecr:latest" >> "$GITHUB_ENV"

      - name: Push image to AWS Elastic Container Registry
        run: |
          mapfile -t digest_args < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sed "s#^#${IMAGE}@sha256:#")
          docker buildx imagetools create --tag "${AWS_IMAGE}" --tag "${AWS_IMAGE_LATEST}" "${digest_args[@]}"
