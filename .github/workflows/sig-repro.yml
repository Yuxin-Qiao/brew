name: sig-repro

on:
  push:
    branches:
      - sig-repro

permissions:
  contents: read

jobs:
  repro:
    runs-on: macos-15-intel
    steps:
      - name: Show architecture
        run: uname -m; sysctl -n hw.optional.arm64 2>/dev/null || true; brew --prefix

      - name: Install ruby (Intel bottle, triggers relocation re-sign)
        run: brew install ruby

      - name: Verify ruby-macho re-signed libruby
        run: |
          set +e
          codesign --verify --strict "$(brew --prefix ruby)/lib/libruby.4.0.dylib"
          echo "VERIFY_EXIT=$?"
          set -e
          ls -la "$(brew --prefix ruby)/lib/libruby.4.0.dylib"

      - name: Experiments to isolate root cause
        run: |
          set -e
          RUBY=$(ls -d /usr/local/Homebrew/Library/Homebrew/vendor/portable-ruby/*/bin/ruby | head -1)
          MACHO_GEM=$(ls -d /usr/local/Homebrew/Library/Homebrew/vendor/bundle/ruby/*/gems/ruby-macho-6.0.0/lib | head -1)
          SRC="$(brew --prefix ruby)/lib/libruby.4.0.dylib"

          cp "$SRC" /tmp/libruby.macho.dylib

          # A: ruby-macho re-sign with the identifier /usr/bin/codesign uses.
          cp "$SRC" /tmp/libruby.expa.dylib
          "$RUBY" -I "$MACHO_GEM" -e '
            require "macho"
            m = MachO.open("/tmp/libruby.expa.dylib")
            m.codesign!(identifier: "libruby.4")
            m.write!
          '

          # B: codesign with the longer identifier ruby-macho uses.
          cp "$SRC" /tmp/libruby.expb.dylib
          codesign --force --sign - --identifier libruby.4.0 /tmp/libruby.expb.dylib

          for f in libruby.macho libruby.expa libruby.expb; do
            set +e
            codesign --verify --strict "/tmp/$f.dylib"
            echo "${f}_VERIFY_EXIT=$?"
            set -e
            codesign -dvvv "/tmp/$f.dylib" 2>&1 | rg "Identifier=|CodeDirectory|Hash type"
          done

      - name: Upload signed copies for offline diff
        uses: actions/upload-artifact@v4
        with:
          name: signed-dylibs
          path: |
            /tmp/libruby.macho.dylib
            /tmp/libruby.expa.dylib
            /tmp/libruby.expb.dylib
